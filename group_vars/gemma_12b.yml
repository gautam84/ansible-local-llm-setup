---
# Copy the handle from the Kaggle model page (kagglehub snippet) + version number:
#   iamhellodk/<model-slug>/<framework>/<variation>/<version>
kaggle_model_handle: "iamhellodk/<gemma-12b-slug>/<framework>/<variation>/<version>"   # CHANGE
model_name: "gemma-12b"
model_quantize: false        # assume already MLX-quantized on Kaggle; flip if it's raw HF weights
server_module: "mlx_vlm.server"   # mlx_lm cannot load Gemma 4 12B
server_port: 8080
model_serve: true
