---
# Copy the handle from the Kaggle model page (kagglehub snippet) + version number:
#   iamhellodk/<model-slug>/<framework>/<variation>/<version>
kaggle_model_handle: "iamhellodk/<qwen-27b-slug>/<framework>/<variation>/<version>"   # CHANGE
model_name: "qwen-27b"
model_quantize: false        # assume already MLX-quantized on Kaggle; flip if it's raw HF weights
server_module: "mlx_lm.server"
server_port: 8080
model_serve: false          # ~15GB+ at 4-bit: does not fit one 16GB mini → served via MLX ring, download only here
