[defaults]
inventory = inventory.ini
forks = 30
timeout = 30
host_key_checking = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml

[ssh_connection]
pipelining = True
# ServerAlive* = keep flaky sessions (Zscaler/idle drops) from silently dying
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
